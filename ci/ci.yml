# Copy to .github/workflows/ci.yml when publishing the combined repository.
# Database and browser suites run separately against an isolated test database.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DB_DATABASE: neat_portal_test
      DB_USERNAME: ci
      JWT_SECRET: ci-only-not-a-production-secret
      MAIL_TRANSPORT: json
    defaults:
      run:
        working-directory: express-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: express-backend/package-lock.json
      - run: npm ci
      - run: npm run check:no-ts
      - run: npm run check:no-ddl
      - run: npm run check:imports
      - run: npm run lint
      - run: npx vitest run tests/unit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextjs-frontend/package-lock.json
      - run: npm ci
      - run: npm run check:no-ts
      - run: npm run lint
      - run: npm run build
